[package]
name = "axiom"
version = "0.1.0"
edition = "2021"
description = "Axiom — local developer utility that discovers, prepares, and runs projects"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = "0.6.6"
dirs = "5"
thiserror = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
